{{- if .Values.datadog.apiKeySecret.create }}
# Own API key rather than the datadog-operator Application's datadog-secret, so
# a gateway problem stays a gateway problem. Same store, same Secrets Manager
# entry -- nothing new to provision.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.datadog.apiKeySecret.name }}
  labels:
    {{- include "otel-trace-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.datadog.apiKeySecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.datadog.apiKeySecret.secretStore.name }}
    kind: {{ .Values.datadog.apiKeySecret.secretStore.kind }}
  target:
    name: {{ .Values.datadog.apiKeySecret.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.datadog.apiKeySecret.key }}
      remoteRef:
        key: {{ .Values.datadog.apiKeySecret.remoteRef.key }}
        property: {{ .Values.datadog.apiKeySecret.remoteRef.property }}
{{- end }}
